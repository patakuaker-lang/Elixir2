name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Preparar proyecto
        run: |
          unzip -q ElixirTracker.zip
          cp modelo_cartas.tflite ElixirTracker/app/src/main/assets/modelo_cartas.tflite
      - name: Compilar
        working-directory: ElixirTracker
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: elixir-tracker-apk
          path: ElixirTracker/app/build/outputs/apk/debug/app-debug.apk
